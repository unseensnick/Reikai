name: Build & publish release

# Stable channel. Signs with the repo keystore secrets (AGP-native, see app/build.gradle.kts),
# publishes to this repo as a DRAFT for review; the in-app updater sees it once you publish.
# Nightly builds are handled separately by nightly.yml.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, no leading v (e.g. 1.9.8.0.0)'
        required: true
      message:
        description: 'Optional note shown at the top of the release body'
        required: false

# A tag push racing a manual dispatch (or a re-tag) must not launch two signed builds; never cancel a
# release mid-flight, so it can finish publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# Every job reads the tag from here, so a manual dispatch and a tag push name it the same way.
env:
  VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}

jobs:
  # Tests, the signed release build and the FOSS build run side by side on separate runners, and
  # publish waits for all three, so a failing test or build still drafts nothing. In one job they
  # took about 26 minutes in turn.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run unit tests
        run: ./gradlew test

  release:
    name: Build signed release
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Write the Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/ci/write-firebase-config.sh

      # The build script reads a keystore path, never the base64 secret: writing that file from
      # Gradle's configuration phase is a side effect the configuration cache refuses to replay.
      - name: Decode the signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/reikai.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build signed release APKs
        run: ./gradlew assembleRelease -Pdist=github
        env:
          REIKAI_GITHUB_RELEASE: "true"
          storeFile: ${{ runner.temp }}/reikai.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Stable builds ship to users, so keep their R8 mapping to deobfuscate crash stacks.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-${{ env.VERSION_TAG }}
          path: app/build/outputs/mapping/release

      # Handed to the publish job only, so it is kept for a day.
      - name: Hand the APKs to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks-release-${{ env.VERSION_TAG }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 1
          if-no-files-found: error

  # The Firebase-free alternative. Its own runner, because telemetry is a whole-build property set by
  # -Pdist rather than a per-variant one, so it never shared a Gradle run with the release build.
  foss:
    name: Build signed FOSS
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode the signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/reikai.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # Universal only, and the name must keep "-foss" for the in-app updater to match it.
      - name: Build signed FOSS APK
        run: ./gradlew assembleFoss -Pdist=foss
        env:
          REIKAI_GITHUB_RELEASE: "true"
          storeFile: ${{ runner.temp }}/reikai.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # FOSS sends no crash reports at all, so its mapping is the only way to read a pasted stack.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping-foss-${{ env.VERSION_TAG }}
          path: app/build/outputs/mapping/foss

      - name: Hand the APK to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks-foss-${{ env.VERSION_TAG }}
          path: app/build/outputs/apk/foss/*.apk
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Draft the release
    runs-on: ubuntu-latest
    needs: [test, release, foss]
    steps:
      # Full history and tags: the notes link the changes since the previous tag.
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Back where package-apks.sh reads them.
      - name: Fetch the release APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks-release-${{ env.VERSION_TAG }}
          path: app/build/outputs/apk/release

      - name: Fetch the FOSS APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apks-foss-${{ env.VERSION_TAG }}
          path: app/build/outputs/apk/foss

      - name: Install parse-changelog
        uses: taiki-e/install-action@parse-changelog

      # A notes rule that stops holding only shows up as a messy published release, so check it first.
      - name: Check the release-body rules
        run: bash scripts/ci/release-notes-test.sh

      - name: Prepare release body
        env:
          VERSION_TAG: ${{ env.VERSION_TAG }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: bash scripts/ci/release-notes.sh

      - name: Rename APKs and checksum
        run: bash scripts/ci/package-apks.sh release "${VERSION_TAG}"

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Reikai ${{ env.VERSION_TAG }}
          # The in-app update dialog shows this body only up to the last <!--> marker (see
          # ReleaseServiceImpl), so the download guidance and checksums below it stay GitHub-only.
          body: |
            ${{ env.RELEASE_BODY }}

            <!-->

            ### Which file?

            - `reikai-${{ env.VERSION_TAG }}.apk` if you are unsure. Universal, runs on any device.
            - `reikai-arm64-v8a-${{ env.VERSION_TAG }}.apk` and the other ABI files are smaller downloads for one CPU type. Most modern phones are `arm64-v8a`.
            - `reikai-foss-${{ env.VERSION_TAG }}.apk` has no crash reporting or analytics compiled in. It installs as a separate app, so moving to or from it needs a backup and restore.

            ${{ env.CHECKSUMS }}
          files: |
            reikai-${{ env.VERSION_TAG }}.apk
            reikai-arm64-v8a-${{ env.VERSION_TAG }}.apk
            reikai-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            reikai-x86-${{ env.VERSION_TAG }}.apk
            reikai-x86_64-${{ env.VERSION_TAG }}.apk
            reikai-foss-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
