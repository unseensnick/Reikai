name: Build & publish preview

# Preview/nightly channel. Builds on every code push to the working branch (and on demand), signs with
# the repo keystore secrets (AGP-native), and publishes a non-prerelease to the unseensnick/Reikai-preview
# bucket so the in-app updater (preview builds check that repo) finds it. Cross-repo publish needs a PAT
# with Contents: write on Reikai-preview, stored as the PREVIEW_REPO_TOKEN secret on this repo.

on:
  push:
    branches:
      # Work happens on the release branch, which main only receives at the merge, so automation has
      # to watch both. They are safe to list together only because of the guard job below: tags are
      # r<commitCount> and the two branches count independently, so a preview cut from main while a
      # release branch is ahead would be numbered below the newest one, and the guard refuses that
      # rather than publishing a release its own prune would delete.
      - "feat/**"
      - "fix/**"
      - main
    paths:
      # Allow-list of app-affecting inputs: only a change to one of these can alter the built APK,
      # so only these trigger a preview. Anything else (docs, .github, .githooks, .claude, repo
      # meta) is repo-only and skipped. Whitelisting means new non-app content is excluded by
      # default, and a new module / gradle file is covered automatically.
      - "**/src/**" # all module sources: Kotlin/Java, AndroidManifest, res, sqldelight, moko-resources
      - "**.kts" # gradle build scripts (root, modules, build-logic)
      - "**.pro" # proguard / R8 rules
      - "gradle/**" # version catalogs, build-logic, wrapper
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Create a draft (test) preview release instead of publishing"
        required: false
        type: boolean
        default: false

concurrency:
  # A burst of pushes collapses to one build (the latest wins).
  group: preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  PREVIEW_REPO: unseensnick/Reikai-preview

jobs:
  # Refuses a build that would publish nothing new. Adapted from Mihon's own preview workflow
  # (mihonapp/mihon-preview 64135ef), which skips a scheduled run when no commits landed since the
  # last release. Reikai has no schedule, so the same idea is pointed at what actually bites here:
  # a tag that does not climb, and a merge that rebuilds a tree already published.
  check:
    name: Check the build would publish something new
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare against the newest preview
        id: check
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
        run: |
          set -e
          # Only ever written when skipping, so the build job's `!= 'true'` does not depend on which
          # of two writes to the same output key wins.
          skip() { echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::Skipping preview: $1"; exit 0; }

          # A commit carrying a release tag ships as that release; a preview of it duplicates it.
          if git tag --points-at HEAD | grep -qE '^v[0-9]'; then
            skip "$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1) is a release commit"
          fi

          commit_count=$(git rev-list --count HEAD)
          prev_tag=$(gh release list --repo "$PREVIEW_REPO" --json tagName --limit 1 \
                     --jq 'select(length > 0) | .[0].tagName' || true)
          if [ -z "$prev_tag" ]; then
            echo "No previous preview; building r${commit_count}"
            exit 0
          fi

          # Tags are r<commitCount> and the prune keeps the highest numbers, so a build numbered at
          # or below the newest would be deleted by its own run and ignored by the in-app updater,
          # which compares the tag number against the installed build's commit count.
          prev_count=${prev_tag#r}
          if [ "$commit_count" -le "$prev_count" ]; then
            skip "r${commit_count} would not climb above ${prev_tag}; is this branch behind the one that built it?"
          fi

          # Same content as the last preview means the same APK. Compare trees, not commits: a merge
          # into another branch is a new commit over an identical tree. A manual run builds anyway,
          # since asking for one is deliberate.
          prev_sha=$(gh api "repos/$PREVIEW_REPO/commits/$prev_tag" --jq '.commit.message' 2>/dev/null \
                     | sed -n 's/^preview r[0-9]* (\([0-9a-f]\{7,40\}\))$/\1/p' | head -1)
          if [ "${{ github.event_name }}" = 'push' ] && [ -n "$prev_sha" ] && git cat-file -e "${prev_sha}^{commit}" 2>/dev/null; then
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "${prev_sha}^{tree}")" ]; then
              skip "tree is identical to ${prev_tag}, so the APK would be the same"
            fi
          fi

          echo "Building r${commit_count}, previous ${prev_tag}"

  preview:
    name: Build signed preview
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.skip != 'true'
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # The action writes the Gradle cache only from the default branch by default, and preview
          # builds run almost entirely from the release branch (feat/**), so every one of them was
          # restoring whatever main last wrote and discarding its own dependencies, transforms and
          # build-cache entries. Writing here keeps a release branch warm across its own cycle.
          # Not done on release.yml: a tag ref's cache is restorable only by that same tag, so a
          # release build can read main's cache but writing one would never be read again.
          cache-read-only: false

      - name: Setup Android SDK
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Run unit tests
        run: ./gradlew test

      - name: Build signed preview APKs
        run: ./gradlew assemblePreview -Penable-updater
        env:
          REIKAI_GITHUB_RELEASE: "true"
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Preview builds are distributed to testers, so keep their R8 mapping to deobfuscate crash stacks.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-preview-${{ github.sha }}
          path: app/build/outputs/mapping/preview

      - name: Install parse-changelog
        uses: taiki-e/install-action@parse-changelog

      - name: Prepare release body
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
        run: |
          set -e
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> "$GITHUB_ENV"

          # Resolve the previous preview's source commit by reading it back off that release's stamp
          # commit, which records it. The old arithmetic (HEAD~(count - prevCount)) assumed every preview
          # was cut from the same branch: counts on main and on a feature branch are unrelated, so a
          # preview following one built elsewhere silently diffed against a stranger commit that happened
          # to sit that far back, and the notes listed the whole [Unreleased] section.
          prev_ref=""
          prev_tag=$(gh release list --repo "$PREVIEW_REPO" --json tagName --limit 1 --jq 'select(length > 0) | .[0].tagName' || true)
          if [ -n "$prev_tag" ]; then
            prev_sha=$(gh api "repos/$PREVIEW_REPO/commits/$prev_tag" --jq '.commit.message' 2>/dev/null \
                       | sed -n 's/^preview r[0-9]* (\([0-9a-f]\{7,40\}\))$/\1/p' | head -1)
            if [ -n "$prev_sha" ] && git cat-file -e "${prev_sha}^{commit}" 2>/dev/null; then
              if git merge-base --is-ancestor "$prev_sha" HEAD; then
                prev_ref="$prev_sha"
              else
                # That preview came off another branch, so the honest base is where the two diverged.
                prev_ref=$(git merge-base "$prev_sha" HEAD || true)
              fi
            fi
          fi
          # A stamp with no recorded commit (or one this clone cannot see) leaves prev_ref empty, and the
          # notes fall back to the whole [Unreleased] section rather than to a guess.
          echo "Previous preview ${prev_tag:-none}, diffing against ${prev_ref:-nothing}"

          # Preview notes are the entries ADDED to CHANGELOG.md's [Unreleased] since the previous preview
          # (the running list would otherwise repeat every build). Diff the current [Unreleased] against
          # the same section as it stood at the previous preview's commit. When the changelog was NOT
          # touched since then, fall back to the commit subjects in that range so the notes still say
          # what changed.
          parse-changelog CHANGELOG.md Unreleased > /tmp/cur.txt 2>/dev/null || true
          : > /tmp/prev.txt
          if [ -n "$prev_ref" ]; then
            git show "$prev_ref:CHANGELOG.md" > /tmp/prevchg.md 2>/dev/null \
              && parse-changelog /tmp/prevchg.md Unreleased > /tmp/prev.txt 2>/dev/null || true
          fi

          new_lines=$(grep -vxF -f /tmp/prev.txt /tmp/cur.txt 2>/dev/null | sed '/^[[:space:]]*$/d' || true)
          # Reduce each entry to its one-line bold headline, matching the stable release notes.
          new_lines=$(printf '%s\n' "$new_lines" | sed -E -e 's/^- \*\*([^*]+)\*\*.*/- \1/' -e 's/^\*\*([^*]+)\*\*$/#### \1/')
          repo="${{ github.server_url }}/${{ github.repository }}"
          {
            echo "RELEASE_BODY<<__EOF__"
            if [ -n "$new_lines" ]; then
              echo "### New since the last preview"
              echo ""
              echo "$new_lines"
              echo ""
              # Pin the link to the commit this build came from, not to a branch. A preview is usually
              # cut from a feature branch, so blob/main pointed at a changelog that does not contain the
              # entries listed above it, and a branch link would 404 once that branch is merged away.
              printf '**Full changelog:** %s/blob/%s/CHANGELOG.md\n' "$repo" "${{ github.sha }}"
            else
              commits=""
              if [ -n "$prev_ref" ]; then
                commits=$(git log --no-merges --format='- %s' "$prev_ref..HEAD" || true)
              fi
              if [ -n "$commits" ]; then
                echo "### Changes since the last preview"
                echo ""
                echo "$commits"
              else
                echo "No changelog or commit changes since the last preview."
              fi
            fi
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Rename APKs
        run: |
          set -e
          d=app/build/outputs/apk/preview
          mv "$d/app-universal-preview.apk"    "reikai-r${COMMIT_COUNT}.apk"
          mv "$d/app-arm64-v8a-preview.apk"    "reikai-arm64-v8a-r${COMMIT_COUNT}.apk"
          mv "$d/app-armeabi-v7a-preview.apk"  "reikai-armeabi-v7a-r${COMMIT_COUNT}.apk"
          mv "$d/app-x86-preview.apk"          "reikai-x86-r${COMMIT_COUNT}.apk"
          mv "$d/app-x86_64-preview.apk"       "reikai-x86_64-r${COMMIT_COUNT}.apk"

      - name: Stamp a dated commit for this release to hang on
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
        run: |
          set -e
          # The releases page orders by the TAG's commit date, not the publish date. Every preview tag
          # used to point at the preview repo's single LICENSE commit, so that key tied across all of
          # them and GitHub fell back to comparing tag names as strings, which sorts r1350 below r380.
          # Each release now gets its own commit dated at build time, so the primary sort works and the
          # tie-break never runs. The commit reuses main's tree and hangs off it as a sibling, reachable
          # only through its tag, so the preview repo's own history stays a single LICENSE commit.
          # The message records the Reikai commit this preview was built from, in the exact shape the
          # release-body step parses to find the previous preview's base. Keep the two in step.
          base=$(gh api "repos/$PREVIEW_REPO/git/ref/heads/main" --jq '.object.sha')
          tree=$(gh api "repos/$PREVIEW_REPO/commits/main" --jq '.commit.tree.sha')
          bot='{"name":"github-actions[bot]","email":"41898282+github-actions[bot]@users.noreply.github.com"}'
          stamp=$(jq -n --arg m "preview r${COMMIT_COUNT} ($(git rev-parse HEAD))" --arg t "$tree" --arg p "$base" \
                        --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson who "$bot" \
                    '{message:$m, tree:$t, parents:[$p],
                      author:    ($who + {date:$d}),
                      committer: ($who + {date:$d})}' \
                  | gh api "repos/$PREVIEW_REPO/git/commits" --input - --jq '.sha')
          echo "STAMP_SHA=$stamp" >> "$GITHUB_ENV"

      - name: Publish preview release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          repository: ${{ env.PREVIEW_REPO }}
          token: ${{ secrets.PREVIEW_REPO_TOKEN }}
          tag_name: r${{ env.COMMIT_COUNT }}
          # Creates the tag on the stamp commit above, which is what dates the release.
          target_commitish: ${{ env.STAMP_SHA }}
          name: Reikai Preview r${{ env.COMMIT_COUNT }}
          # The in-app update dialog shows this body only up to the last <!--> marker (see
          # ReleaseServiceImpl), so the download note below it stays GitHub-only.
          body: |
            ${{ env.RELEASE_BODY }}

            <!-->

            > If you are unsure which to download, use `reikai-r${{ env.COMMIT_COUNT }}.apk` (universal).
          files: |
            reikai-r${{ env.COMMIT_COUNT }}.apk
            reikai-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
            reikai-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
            reikai-x86-r${{ env.COMMIT_COUNT }}.apk
            reikai-x86_64-r${{ env.COMMIT_COUNT }}.apk
          draft: ${{ github.event.inputs.dry-run == 'true' }}
          prerelease: false

      - name: Prune old previews (keep newest 365)
        if: ${{ github.event.inputs.dry-run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_REPO_TOKEN }}
        run: |
          set -e
          # Keep the 365 highest build numbers (tags are r<commitCount>). Sorting by the numeric tag,
          # not createdAt: a history-rewrite force-push can leave every release with the same createdAt,
          # which made the old date sort delete the just-published release instead of the oldest.
          # The list limit has to stay above the retention or the slice below is always empty and the
          # prune silently stops deleting anything.
          gh release list --repo "$PREVIEW_REPO" --json tagName --limit 500 \
            | jq -r 'sort_by(.tagName | ltrimstr("r") | tonumber) | reverse | .[365:] | .[].tagName' \
            | while read -r tag; do
                [ -n "$tag" ] && gh release delete "$tag" --repo "$PREVIEW_REPO" --cleanup-tag --yes
              done
