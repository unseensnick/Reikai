name: Docs lint

# Enforces the CHANGELOG, ROADMAP, upstream-sync and feature-ports conventions (see .claude/rules/workflow.md:
# "After completing any code change", "Public-facing naming", "Roadmap & plans"), plus the
# no-plan-codename rule for code comments (code-quality.md), comment [Symbol] links, and the
# docs/dev/subsystems/ pages.
#
# The rules live in scripts/lint-docs.sh, which .githooks/pre-commit calls too. The hook checks what
# a commit stages; this checks the whole tree, so anything that slipped in without the hook fails
# here. Both read the same patterns, so neither can quietly get stricter than the other.

on:
  pull_request:
    paths: ['CHANGELOG.md', 'ROADMAP.md', 'docs/dev/upstream-sync.md', 'docs/dev/feature-ports.md', 'docs/dev/off-path-manifest.md', 'docs/dev/plans/**', 'docs/dev/subsystems/**', 'scripts/lint-docs.sh', 'scripts/dup-check.ps1', 'scripts/dup-check-test.ps1', 'scripts/mihon-ownership.ps1', 'scripts/dup-baseline.txt', '**/*.kt', '**/*.kts', '**/*.sq', '**/*.sqm']
  push:
    branches: [main]
    paths: ['CHANGELOG.md', 'ROADMAP.md', 'docs/dev/upstream-sync.md', 'docs/dev/feature-ports.md', 'docs/dev/off-path-manifest.md', 'docs/dev/plans/**', 'docs/dev/subsystems/**', 'scripts/lint-docs.sh', 'scripts/dup-check.ps1', 'scripts/dup-check-test.ps1', 'scripts/mihon-ownership.ps1', 'scripts/dup-baseline.txt', '**/*.kt', '**/*.kts', '**/*.sq', '**/*.sqm']

permissions:
  contents: read

jobs:
  lint:
    name: Lint docs
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The rules are regexes, and one that silently stops matching looks exactly like a clean tree.
      - name: Check the rules still reject what they should
        run: bash scripts/lint-docs-test.sh

      - name: Lint CHANGELOG.md
        run: |
          bash scripts/lint-docs.sh source-names CHANGELOG.md CHANGELOG.md
          bash scripts/lint-docs.sh changelog-entries CHANGELOG.md

      - name: Lint ROADMAP.md
        run: |
          bash scripts/lint-docs.sh source-names ROADMAP.md ROADMAP.md
          bash scripts/lint-docs.sh em-dash ROADMAP.md ROADMAP.md
          bash scripts/lint-docs.sh issue-refs ROADMAP.md ROADMAP.md "'Roadmap N' or owner/repo#N"

      # Content-source names are allowed in these two: they are dev records, not marketing.
      - name: Lint the dev sync records
        run: |
          for doc in docs/dev/upstream-sync.md docs/dev/feature-ports.md; do
            bash scripts/lint-docs.sh em-dash "$doc" "$doc"
            bash scripts/lint-docs.sh issue-refs "$doc" "$doc" "owner/repo#N (mihonapp/mihon#N for upstream)"
          done

      - name: Lint code comments for plan codenames
        run: bash scripts/lint-docs.sh codenames --tree

      # Report only: the markers written before content-layer.md fixed the pin spelling are paid off as
      # their files are next touched. The hook fails a new one on the lines a commit adds.
      - name: Report twin markers that name no pin
        run: bash scripts/lint-docs.sh twin-pins --tree

      # Report only, like the twin markers: the hook fails a [Symbol] naming nothing on the lines a
      # commit adds, and the ones already in the tree are fixed as their files are next touched.
      - name: Report comment links that name no symbol
        run: bash scripts/lint-docs.sh kdoc-links --tree

      # A subsystem doc describes what is, so dates, SHAs, steps, rounds, phases, rulings, a Status
      # section and an overlong page fail. Passes while the folder does not exist.
      - name: Lint the subsystem docs
        run: bash scripts/lint-docs.sh subsystem-docs

      # The duplicate check reads which files are Reikai's from Mihon's tree at the synced base (the top
      # ledger row of docs/dev/upstream-sync.md) and at upstream HEAD. Blobless, since listing a tree
      # needs every tree object and no file contents; a depth-1 clone cannot reach the base.
      - name: Clone Mihon's history
        run: git clone --quiet --filter=blob:none --no-checkout https://github.com/mihonapp/mihon.git "$RUNNER_TEMP/mihon"

      - name: Check the duplicate check still finds what it should
        run: pwsh -NoProfile -File scripts/dup-check-test.ps1

      # A cross-file copy in Reikai-owned Kotlin or an RK island that scripts/dup-baseline.txt does not
      # list (DRY in code-quality.md). Keyed by file pair and token hash, so line moves do not re-fire it.
      - name: Check for new duplicated code
        run: pwsh -NoProfile -File scripts/dup-check.ps1 -MihonClone "$RUNNER_TEMP/mihon"

      # CI has no refs/ clone, so it cannot diff against upstream; it checks that every manifested
      # file stays deleted and every replacement exists, which is what catches a resurrected file or
      # a row pointing nowhere. The hook owns the undeclared-reroute half.
      - name: Lint the off-path manifest
        run: bash scripts/lint-docs.sh manifest-rows docs/dev/off-path-manifest.md

      # A Key files path that no longer exists sends a reader to nothing while reading as current.
      - name: Lint the Key files of plans and subsystem docs
        run: bash scripts/lint-docs.sh key-files docs/dev/plans/*.md docs/dev/subsystems/*.md
