name: Docs lint

# Enforces the CHANGELOG, ROADMAP, upstream-sync and feature-ports conventions (see .claude/rules/workflow.md:
# "After completing any code change", "Public-facing naming", "Roadmap & plans"), plus the
# no-plan-codename rule for code comments (code-quality.md).
#
# The rules live in scripts/lint-docs.sh, which .githooks/pre-commit calls too. The hook checks what
# a commit stages; this checks the whole tree, so anything that slipped in without the hook fails
# here. Both read the same patterns, so neither can quietly get stricter than the other.

on:
  pull_request:
    paths: ['CHANGELOG.md', 'ROADMAP.md', 'docs/dev/upstream-sync.md', 'docs/dev/feature-ports.md', 'docs/dev/off-path-manifest.md', 'scripts/lint-docs.sh', '**/*.kt', '**/*.kts', '**/*.sq', '**/*.sqm']
  push:
    branches: [main]
    paths: ['CHANGELOG.md', 'ROADMAP.md', 'docs/dev/upstream-sync.md', 'docs/dev/feature-ports.md', 'docs/dev/off-path-manifest.md', 'scripts/lint-docs.sh', '**/*.kt', '**/*.kts', '**/*.sq', '**/*.sqm']

permissions:
  contents: read

jobs:
  lint:
    name: Lint docs
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The rules are regexes, and one that silently stops matching looks exactly like a clean tree.
      - name: Check the rules still reject what they should
        run: bash scripts/lint-docs-test.sh

      - name: Lint CHANGELOG.md
        run: |
          bash scripts/lint-docs.sh source-names CHANGELOG.md CHANGELOG.md
          bash scripts/lint-docs.sh changelog-entries CHANGELOG.md

      - name: Lint ROADMAP.md
        run: |
          bash scripts/lint-docs.sh source-names ROADMAP.md ROADMAP.md
          bash scripts/lint-docs.sh em-dash ROADMAP.md ROADMAP.md
          bash scripts/lint-docs.sh issue-refs ROADMAP.md ROADMAP.md "'Roadmap N' or owner/repo#N"

      # Content-source names are allowed in these two: they are dev records, not marketing.
      - name: Lint the dev sync records
        run: |
          for doc in docs/dev/upstream-sync.md docs/dev/feature-ports.md; do
            bash scripts/lint-docs.sh em-dash "$doc" "$doc"
            bash scripts/lint-docs.sh issue-refs "$doc" "$doc" "owner/repo#N (mihonapp/mihon#N for upstream)"
          done

      - name: Lint code comments for plan codenames
        run: bash scripts/lint-docs.sh codenames --tree

      # CI has no refs/ clone, so it cannot diff against upstream; it checks that every manifested
      # file stays deleted and every replacement exists, which is what catches a resurrected file or
      # a row pointing nowhere. The hook owns the undeclared-reroute half.
      - name: Lint the off-path manifest
        run: bash scripts/lint-docs.sh manifest-rows docs/dev/off-path-manifest.md
