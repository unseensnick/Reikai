# The app's own Application builds the whole Metro graph and starts Firebase. Compose UI tests
# host their screens with test doubles instead (ComposeTestHost), so a plain one is enough.
application=android.app.Application
# The app ships conscrypt-android, whose native loader asks for the Android library and breaks
# Robolectric's desktop Conscrypt; nothing a UI test hosts makes a TLS connection.
conscryptMode=OFF
